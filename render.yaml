services:
  - type: web
    runtime: static
    name: durgeshgowdac
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://durgeshgowdac.onrender.com
      - key: GITHUB_TOKEN
        sync: false