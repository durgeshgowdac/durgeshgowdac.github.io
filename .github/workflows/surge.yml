name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: surge
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Sitemap, robots.txt and social-preview URLs point at this host
          NEXT_PUBLIC_SITE_URL: https://durgeshgowdac.surge.sh
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx surge ./out durgeshgowdac.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
